<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9534f">
  <title>家庭行事曆</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 第一次使用：輸入名字與家庭密碼 -->
  <section id="setup" class="setup" hidden>
    <img src="/icons/icon.svg" alt="" width="72" height="72">
    <h1>家庭行事曆</h1>
    <p class="muted">全家共用一份行事曆，時間到每個人都會收到通知。</p>
    <form id="setup-form">
      <label>你的名字<input name="name" required maxlength="30" placeholder="例如：媽媽" autocomplete="nickname"></label>
      <label>家庭密碼<input name="key" required type="password" placeholder="向家人詢問" autocomplete="current-password"></label>
      <p id="setup-error" class="error" role="alert"></p>
      <button class="primary" type="submit">開始使用</button>
    </form>
  </section>

  <main id="app" hidden>
    <header class="topbar">
      <button id="prev" class="icon-btn" aria-label="上個月">‹</button>
      <h1 id="month-title"></h1>
      <button id="next" class="icon-btn" aria-label="下個月">›</button>
      <button id="today" class="text-btn">今天</button>
      <button id="open-settings" class="icon-btn" aria-label="設定">⚙</button>
    </header>

    <div id="notify-banner" class="banner" hidden>
      <span id="notify-text">開啟通知，時間到才會跳提醒</span>
      <button id="enable-notify" class="primary small">開啟通知</button>
    </div>

    <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div id="grid" class="grid"></div>

    <section class="day-panel">
      <h2 id="day-title"></h2>
      <ul id="day-list" class="event-list"></ul>
      <h2 class="upcoming-title">接下來</h2>
      <ul id="upcoming-list" class="event-list"></ul>
    </section>

    <p id="status" class="status" role="status"></p>
    <button id="add" class="fab" aria-label="新增事件">＋</button>
  </main>

  <!-- 新增 / 編輯事件 -->
  <dialog id="event-dialog">
    <form id="event-form" method="dialog">
      <h2 id="dialog-title">新增事件</h2>
      <label>什麼事<input name="title" required maxlength="100" placeholder="例如：帶阿嬤看牙醫"></label>
      <div class="row">
        <label>日期<input name="date" type="date" required></label>
        <label>時間<input name="time" type="time" required></label>
      </div>
      <div class="row">
        <label>提前提醒
          <select name="remind_before">
            <option value="0">不用，準時提醒就好</option>
            <option value="5">提前 5 分鐘</option>
            <option value="10">提前 10 分鐘</option>
            <option value="15">提前 15 分鐘</option>
            <option value="30">提前 30 分鐘</option>
            <option value="60">提前 1 小時</option>
            <option value="120">提前 2 小時</option>
            <option value="1440">提前 1 天</option>
          </select>
        </label>
        <label>重複
          <select name="repeat">
            <option value="none">不重複</option>
            <option value="daily">每天</option>
            <option value="weekly">每週</option>
            <option value="monthly">每月</option>
            <option value="yearly">每年</option>
          </select>
        </label>
      </div>
      <label>備註<textarea name="note" rows="2" maxlength="1000" placeholder="可不填"></textarea></label>
      <p id="event-meta" class="muted small-text"></p>
      <p id="event-error" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" id="delete-event" class="danger" hidden>刪除</button>
        <span class="spacer"></span>
        <button type="button" id="cancel-event">取消</button>
        <button type="submit" id="save-event" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <!-- 設定 -->
  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <h2>設定</h2>
      <label>你的名字<input name="name" required maxlength="30"></label>
      <div class="setting-row">
        <span>通知</span>
        <span id="notify-state" class="muted"></span>
      </div>
      <button type="button" id="test-notify">送一則測試通知給這台手機</button>
      <h3>已開啟通知的手機</h3>
      <ul id="device-list" class="device-list"></ul>
      <p id="settings-msg" class="muted" role="status"></p>
      <div class="actions">
        <button type="button" id="logout" class="danger">登出這台手機</button>
        <span class="spacer"></span>
        <button type="submit" class="primary">完成</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
